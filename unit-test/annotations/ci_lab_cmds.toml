# covmock:test specifications for ci_lab_cmds.c. Kept beside the tests, not in
# the flight source.

[[test]]
name = "noop_counts_and_reports"
target = "function=CI_LAB_NoopCmd line=41"
invoke = "CI_LAB_NoopCmd(NULL)"
expect-return = "CFE_SUCCESS"
expect-call = ["CFE_EVS_SendEvent count=1"]
reviewed = true

